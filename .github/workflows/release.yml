name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish self-contained Windows x64 app
        run: dotnet publish BleListener/BleListener.csproj --configuration Release --runtime win-x64 --self-contained true
      - name: Create ZIP
        shell: pwsh
        run: Compress-Archive -Path "BleListener\bin\Release\net10.0-windows10.0.19041.0\win-x64\publish\*" -DestinationPath "Aranet4Home-win-x64.zip" -CompressionLevel Optimal
      - name: Create or update GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "Aranet4Home-win-x64.zip" --clobber
          } else {
            gh release create $tag "Aranet4Home-win-x64.zip" --title $tag --generate-notes --verify-tag
          }
